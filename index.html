<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub для команды Флайск — интерактивный курс</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1c2333;--mute:#5d6b85;--line:#dde3ef;--brand:#2f6df6;--brand-d:#1f4fc2;--ok:#1a9d5c;--okbg:#e6f6ee;--bad:#d03a3a;--badbg:#fdeaea;--warn:#a86a00;--warnbg:#fff4de;--side:#141b2e;--code:#0f1524}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100%}
.side{width:290px;flex:none;background:var(--side);color:#cfd7ea;padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:block;color:#fff;font-weight:700;font-size:22px;text-decoration:none;margin-bottom:18px}
.brand span{display:block;font-size:12px;font-weight:400;color:#8fa0c4}
#nav{flex:1}
#nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:#cfd7ea;text-decoration:none;font-size:14px;margin-bottom:2px}
#nav a:hover{background:#1f2942}
#nav a.cur{background:var(--brand);color:#fff}
#nav .n{width:24px;height:24px;border-radius:50%;background:#26324f;display:grid;place-items:center;font-size:12px;flex:none}
#nav a.done .n{background:var(--ok);color:#fff}
#nav a.cur .n{background:#fff;color:var(--brand)}
.side-foot{padding-top:14px;border-top:1px solid #26324f}
.bar{height:8px;background:#26324f;border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.side-foot small{color:#8fa0c4}
.link{background:none;border:0;color:#8fa0c4;text-decoration:underline;cursor:pointer;font-size:12px;padding:6px 0;display:block}
.main{flex:1;min-width:0;padding:32px 40px 80px}
.view{max-width:860px;margin:0 auto}
.burger{display:none}
h1{font-size:30px;line-height:1.25;margin:0 0 8px}
h2{font-size:22px;margin:32px 0 10px}
h3{font-size:17px;margin:22px 0 8px}
p{margin:0 0 12px}
.lead{font-size:18px;color:var(--mute)}
ul,ol{padding-left:22px;margin:0 0 14px}
li{margin-bottom:5px}
code{font:13.5px/1.4 Consolas,"SF Mono",monospace;background:#e9eefb;padding:1px 6px;border-radius:5px;color:#1b3b8f}
pre{background:var(--code);color:#e6edf8;padding:14px 16px;border-radius:10px;overflow:auto;font:13.5px/1.55 Consolas,"SF Mono",monospace;margin:0 0 16px}
pre code{background:none;color:inherit;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.note,.warn,.tip{border-radius:10px;padding:12px 16px;margin:0 0 16px;border-left:4px solid}
.note{background:#eaf1ff;border-color:var(--brand)}
.warn{background:var(--warnbg);border-color:#e0a000}
.tip{background:var(--okbg);border-color:var(--ok)}
.note b:first-child,.warn b:first-child,.tip b:first-child{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14.5px;background:#fff}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#eef2fb}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.ghost:hover{background:#eaf1ff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.pager{margin-top:30px;display:flex;justify-content:space-between;gap:10px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:6px}
.steps{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap}
.steps a{padding:5px 12px;border-radius:20px;background:#e6ebf6;color:var(--mute);font-size:13px;text-decoration:none}
.steps a.cur{background:var(--brand);color:#fff}
.steps a.done{background:var(--okbg);color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:inherit}
.mod:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(47,109,246,.12)}
.mod b{display:block;margin:2px 0 4px}
.mod small{color:var(--mute)}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:#e6ebf6;color:var(--mute)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.q h3{margin-top:0}
.opt{display:block;width:100%;text-align:left;background:#f6f8fd;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px;font-size:15px;cursor:pointer;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--brand);background:#eef4ff}
.opt.sel{border-color:var(--brand);background:#e3edff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.explain{margin-top:10px;padding:10px 14px;border-radius:9px;background:#f0f3fa;font-size:14.5px}
.score{font-size:48px;font-weight:700}
.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}
.term{background:var(--code);border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.term-top{background:#1b2338;color:#8fa0c4;padding:8px 14px;font-size:13px;display:flex;justify-content:space-between}
.term-task{background:#18213a;color:#e6edf8;padding:12px 16px;font-size:14.5px;border-bottom:1px solid #26324f}
.term-task b{color:#7fb0ff}
.term-out{padding:14px 16px;font:13.5px/1.55 Consolas,"SF Mono",monospace;color:#d6deef;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term-out .cmd{color:#fff}.term-out .p{color:#5ee08f}.term-out .err{color:#ff8a8a}.term-out .dim{color:#7d8bab}
.term-in{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #26324f;background:#0b101c}
.term-in span{color:#5ee08f;font:13.5px Consolas,monospace;padding-top:7px}
.term-in input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:14px Consolas,"SF Mono",monospace}
.term-in button{background:#26324f;color:#cfd7ea;border:0;border-radius:6px;padding:4px 12px;cursor:pointer}
.term-in button:hover{background:#34426a}
.prog{font-size:13px;color:#8fa0c4}
.web{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:0 4px 16px rgba(20,27,46,.08)}
.web-top{background:#e9edf6;padding:8px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.web-url{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:3px 14px;font:13px Consolas,"SF Mono",monospace;color:#3b4863;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web-top .prog{color:var(--mute);white-space:nowrap}
.web-task{background:#eaf1ff;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--line)}
.web-page{padding:16px 18px;background:#fbfcfe;border-bottom:1px solid var(--line);font-size:14.5px}
.web-page .gh-h{font-weight:700;font-size:16px;margin-bottom:8px;color:#0b4fd6}
.web-page .gh-box{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px;margin-bottom:8px}
.web-page .gh-box.add{background:#e6f6ee;border-color:#bfe5cf;font-family:Consolas,monospace;font-size:13px}
.web-page .gh-box.del{background:#fdeaea;border-color:#f1c3c3;font-family:Consolas,monospace;font-size:13px}
.web-page .gh-tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin-bottom:10px;font-size:13.5px;color:var(--mute)}
.web-page .gh-tabs span{padding:4px 0}
.web-page .gh-tabs .on{color:var(--ink);font-weight:700;border-bottom:2px solid #f08a2c}
.web-page .gh-side{color:var(--mute);font-size:13px}
.web-act{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px 6px}
.web-btn{background:#f3f6fb;border:1px solid #c5cee0;border-radius:7px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.web-btn:hover{border-color:var(--brand);background:#eaf1ff}
.web-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;width:100%}
.web-form label{flex:1;min-width:240px;font-size:13.5px;color:var(--mute)}
.web-form input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #c5cee0;border-radius:7px;font:14px Consolas,"SF Mono",monospace;color:var(--ink)}
.web-msg{margin:6px 18px 10px;padding:9px 13px;border-radius:9px;font-size:14px}
.web-msg.ok{background:var(--okbg);color:#0f6b3d}
.web-msg.bad{background:var(--badbg);color:#8f2222}
.web-msg.dim{background:#f0f3fa;color:var(--mute)}
.web-foot{padding:6px 18px 14px}
.web-foot .btn{padding:5px 12px;font-size:13px}
.cls{display:grid;grid-template-columns:1fr 220px 28px;gap:8px 12px;align-items:center;margin-bottom:12px}
.cls select{padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.cls .m{font-weight:700;text-align:center}
.cls .m.ok{color:var(--ok)}.cls .m.bad{color:var(--bad)}
.ord{list-style:none;padding:0;margin:0 0 12px}
.ord li{display:flex;gap:10px;align-items:center;background:#f6f8fd;border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:6px}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}
.ord li.bad{border-color:var(--bad);background:var(--badbg)}
.ord li span{flex:1;font-size:14.5px}
.ord button{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer}
.hid{display:none}
@media(max-width:860px){
  .app{display:block}
  .side{position:fixed;left:-300px;top:0;z-index:20;transition:left .2s;width:280px}
  .side.open{left:0}
  .main{padding:56px 16px 60px}
  .burger{display:block;position:fixed;top:10px;left:10px;z-index:10;background:var(--side);color:#fff;border:0;border-radius:8px;padding:8px 14px}
  .cls{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">GitHub<span>курс для команды Флайск</span></a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="bar"><i id="totalBar"></i></div>
      <small id="totalText"></small>
      <button class="link" id="resetBtn" type="button">Сбросить прогресс</button>
    </div>
  </aside>
  <main class="main">
    <button class="burger" id="burger" type="button" aria-label="Меню">Меню</button>
    <div id="view" class="view"></div>
  </main>
</div>
<script>
(function () {
  var KEY = 'ghcourse:v1';
  var C = window.COURSE = { modules: [], data: {}, test: [], widgets: {} };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  C.esc = esc;

  var state;
  function load() {
    try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
    state.quiz = state.quiz || {};
    state.seen = state.seen || {};
    state.test = state.test || { best: 0, passed: false };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  load();

  var PASS_MOD = 0.7, PASS_TEST = 0.8;
  function modDone(m) { return !!(state.quiz[m.id] && state.quiz[m.id].passed); }
  function doneCount() { return C.modules.filter(modDone).length; }

  var $ = function (id) { return document.getElementById(id); };
  var view, nav;

  function renderNav(cur) {
    var h = '<a href="#/" class="' + (cur === 'home' ? 'cur' : '') + '"><span class="n">&#8962;</span>Главная</a>';
    C.modules.forEach(function (m) {
      var cls = (cur === m.id ? 'cur ' : '') + (modDone(m) ? 'done' : '');
      h += '<a href="#/m/' + m.id + '" class="' + cls + '"><span class="n">' + (modDone(m) ? '&#10003;' : m.id) + '</span>' + esc(m.title) + '</a>';
    });
    h += '<a href="#/cheat" class="' + (cur === 'cheat' ? 'cur' : '') + '"><span class="n">&#9776;</span>Шпаргалка</a>';
    h += '<a href="#/test" class="' + (cur === 'test' ? 'cur' : '') + (state.test.passed ? ' done' : '') + '"><span class="n">' + (state.test.passed ? '&#10003;' : '&#9733;') + '</span>Итоговый тест</a>';
    nav.innerHTML = h;
    var total = C.modules.length + 1, d = doneCount() + (state.test.passed ? 1 : 0);
    $('totalBar').style.width = Math.round(d / total * 100) + '%';
    $('totalText').textContent = 'Пройдено ' + d + ' из ' + total;
  }

  function mountWidgets(root) {
    root.querySelectorAll('[data-w]').forEach(function (el) {
      var f = C.widgets[el.dataset.w];
      if (f) f(el, C.data[el.dataset.id] || {});
    });
  }

  function homeView() {
    var h = '<h1>GitHub для команды Флайск</h1>' +
      '<p class="lead">Короткий интерактивный курс: от нуля до уверенной работы с репозиториями, pull request-ами и Claude Code. Примеры основаны на типичной работе нашей команды.</p>';
    h += '<div class="note"><b>Как проходить</b>Каждый блок: уроки, затем проверочные вопросы (нужно ответить правильно минимум на 70%). После всех блоков &mdash; итоговый тест из 20 вопросов (проходной порог 80%). Прогресс сохраняется в этом браузере.</div>';
    h += '<div class="grid">';
    C.modules.forEach(function (m) {
      var q = state.quiz[m.id];
      h += '<a class="mod" href="#/m/' + m.id + '"><span class="badge ' + (modDone(m) ? 'ok' : '') + '">' +
        (modDone(m) ? 'Пройден, ' + Math.round(q.score * 100) + '%' : 'Блок ' + m.id + ' · ' + m.min + ' мин') + '</span><b>' + esc(m.title) + '</b><small>' + esc(m.sub) + '</small></a>';
    });
    h += '<a class="mod" href="#/test"><span class="badge ' + (state.test.passed ? 'ok' : '') + '">' + (state.test.passed ? 'Сдан, лучший результат ' + Math.round(state.test.best * 100) + '%' : 'Финал') + '</span><b>Итоговый тест</b><small>20 вопросов по всем блокам</small></a>';
    h += '<a class="mod" href="#/cheat"><span class="badge">Справочник</span><b>Шпаргалка</b><small>Команды, правила и что делать, если что-то пошло не так</small></a>';
    h += '</div>';
    var next = C.modules.filter(function (m) { return !modDone(m); })[0];
    h += '<p style="margin-top:24px">' + (next
      ? '<a class="btn" href="#/m/' + next.id + '">' + (doneCount() ? 'Продолжить: ' : 'Начать: ') + esc(next.title) + '</a>'
      : '<a class="btn" href="#/test">Пройти итоговый тест</a>') + '</p>';
    view.innerHTML = h;
  }

  function stepsBar(m, cur) {
    var h = '<div class="steps">';
    m.lessons.forEach(function (l, i) {
      h += '<a href="#/m/' + m.id + '/' + (i + 1) + '" class="' + (cur === i + 1 ? 'cur' : (state.seen[m.id + '.' + (i + 1)] ? 'done' : '')) + '">' + (i + 1) + '. ' + esc(l.title) + '</a>';
    });
    h += '<a href="#/m/' + m.id + '/quiz" class="' + (cur === 'quiz' ? 'cur' : (modDone(m) ? 'done' : '')) + '">Проверка</a></div>';
    return h;
  }

  function lessonView(m, n) {
    var l = m.lessons[n - 1];
    state.seen[m.id + '.' + n] = 1; save();
    var prev = n > 1 ? '#/m/' + m.id + '/' + (n - 1) : '#/';
    var next = n < m.lessons.length ? '#/m/' + m.id + '/' + (n + 1) : '#/m/' + m.id + '/quiz';
    view.innerHTML = '<div class="crumbs">Блок ' + m.id + ' &middot; ' + esc(m.title) + '</div><h1>' + esc(l.title) + '</h1>' + stepsBar(m, n) +
      '<div class="body">' + l.html + '</div>' +
      '<div class="pager"><a class="btn ghost" href="' + prev + '">Назад</a><a class="btn" href="' + next + '">' + (n < m.lessons.length ? 'Дальше' : 'К проверочным вопросам') + '</a></div>';
    mountWidgets(view);
  }

  function modIntro(m) {
    var h = '<div class="crumbs">Блок ' + m.id + '</div><h1>' + esc(m.title) + '</h1><p class="lead">' + esc(m.sub) + '</p>' + m.intro;
    h += '<h2>Уроки</h2><ol>';
    m.lessons.forEach(function (l, i) { h += '<li><a href="#/m/' + m.id + '/' + (i + 1) + '">' + esc(l.title) + '</a></li>'; });
    h += '</ol><p><a class="btn" href="#/m/' + m.id + '/1">Начать</a></p>';
    view.innerHTML = h;
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function mix(q) {
    var idx = shuffle(q.o.map(function (_, i) { return i; }));
    return { q: q.q, e: q.e, o: idx.map(function (i) { return q.o[i]; }), a: idx.indexOf(q.a) };
  }

  function questionHtml(q, i, qi) {
    var h = '<div class="q" data-qi="' + qi + '"><h3>' + (i + 1) + '. ' + q.q + '</h3>';
    q.o.forEach(function (o, k) { h += '<button type="button" class="opt" data-k="' + k + '">' + o + '</button>'; });
    return h + '<div class="explain hid"></div></div>';
  }

  function quizView(m) {
    var qs = m.quiz.map(mix), answered = {}, right = 0;
    var prev = state.quiz[m.id];
    view.innerHTML = '<div class="crumbs">Блок ' + m.id + ' &middot; ' + esc(m.title) + '</div><h1>Проверочные вопросы</h1>' + stepsBar(m, 'quiz') +
      '<p class="lead">Отвечай по одному: после ответа сразу видно, верно ли, и почему. Для зачёта блока нужно не меньше 70%.</p>' +
      qs.map(function (q, i) { return questionHtml(q, i, i); }).join('') + '<div id="res"></div>';
    view.querySelectorAll('.q').forEach(function (box) {
      var qi = +box.dataset.qi, q = qs[qi];
      box.querySelectorAll('.opt').forEach(function (b) {
        b.onclick = function () {
          if (answered[qi] !== undefined) return;
          var k = +b.dataset.k; answered[qi] = k;
          if (k === q.a) right++;
          box.querySelectorAll('.opt').forEach(function (x) {
            x.disabled = true;
            if (+x.dataset.k === q.a) x.classList.add('right');
          });
          if (k !== q.a) b.classList.add('wrong');
          var ex = box.querySelector('.explain');
          ex.innerHTML = '<b>' + (k === q.a ? 'Верно. ' : 'Не совсем. ') + '</b>' + q.e;
          ex.classList.remove('hid');
          if (Object.keys(answered).length === qs.length) finish();
        };
      });
    });
    function finish() {
      var sc = right / qs.length, ok = sc >= PASS_MOD;
      var old = state.quiz[m.id];
      state.quiz[m.id] = { score: Math.max(sc, old ? old.score : 0), passed: ok || !!(old && old.passed) };
      save(); renderNav(m.id);
      var n = C.modules.indexOf(m), nx = C.modules[n + 1];
      $('res').innerHTML = '<div class="card"><div class="score ' + (ok ? 'ok' : 'bad') + '">' + right + ' из ' + qs.length + '</div><p>' +
        (ok ? 'Блок зачтён.' : 'Пока не хватает до порога 70%. Перечитай уроки и попробуй ещё раз.') + '</p><div class="row">' +
        '<a class="btn ghost" href="#/m/' + m.id + '/quiz" id="retry">Пройти заново</a>' +
        (ok ? (nx ? '<a class="btn" href="#/m/' + nx.id + '">Следующий блок: ' + esc(nx.title) + '</a>' : '<a class="btn" href="#/test">К итоговому тесту</a>') : '<a class="btn" href="#/m/' + m.id + '/1">К урокам</a>') +
        '</div></div>';
      $('retry').onclick = function (e) { e.preventDefault(); quizView(m); window.scrollTo(0, 0); };
      $('res').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    if (prev && prev.passed) view.insertAdjacentHTML('afterbegin', '<div class="tip"><b>Блок уже зачтён</b>Лучший результат: ' + Math.round(prev.score * 100) + '%. Можно пройти ещё раз для повторения.</div>');
  }

  function testView() {
    var pool = C.test.map(mix), order = shuffle(pool.map(function (_, i) { return i; }));
    var sel = {};
    var h = '<h1>Итоговый тест</h1><p class="lead">' + pool.length + ' вопросов по всем блокам. Ответы показываются в конце. Проходной порог &mdash; 80%.</p>';
    var left = C.modules.filter(function (m) { return !modDone(m); });
    if (left.length) h += '<div class="warn"><b>Не все блоки пройдены</b>Осталось: ' + left.map(function (m) { return esc(m.title); }).join(', ') + '. Тест можно сдавать и так, но лучше сначала пройти блоки.</div>';
    if (state.test.best) h += '<div class="note"><b>Лучший результат</b>' + Math.round(state.test.best * 100) + '%' + (state.test.passed ? ' (тест сдан)' : '') + '</div>';
    order.forEach(function (qi, i) { h += questionHtml(pool[qi], i, qi); });
    h += '<div class="row"><button class="btn" id="submit" type="button" disabled>Завершить тест</button><span id="cnt" class="prog" style="color:#5d6b85"></span></div><div id="res"></div>';
    view.innerHTML = h;
    var cnt = $('cnt'), sub = $('submit');
    function upd() { var n = Object.keys(sel).length; cnt.textContent = 'Отвечено ' + n + ' из ' + pool.length; sub.disabled = n < pool.length; }
    upd();
    view.querySelectorAll('.q').forEach(function (box) {
      var qi = +box.dataset.qi;
      box.querySelectorAll('.opt').forEach(function (b) {
        b.onclick = function () {
          sel[qi] = +b.dataset.k;
          box.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('sel', x === b); });
          upd();
        };
      });
    });
    sub.onclick = function () {
      var right = 0, wrong = [];
      pool.forEach(function (q, qi) { if (sel[qi] === q.a) right++; else wrong.push(qi); });
      var sc = right / pool.length, ok = sc >= PASS_TEST;
      state.test.best = Math.max(state.test.best, sc);
      state.test.passed = state.test.passed || ok;
      save(); renderNav('test');
      var r = '<div class="card"><div class="score ' + (ok ? 'ok' : 'bad') + '">' + right + ' из ' + pool.length + ' (' + Math.round(sc * 100) + '%)</div><p>' +
        (ok ? 'Тест сдан. Теперь можно работать с репозиториями и pull request-ами самостоятельно &mdash; а за шпаргалкой всегда можно вернуться.' : 'Порог 80% не достигнут. Разбор ошибок ниже, потом пройди тест ещё раз.') + '</p>';
      if (wrong.length) {
        r += '<h3>Разбор ошибок</h3>';
        wrong.forEach(function (qi) {
          var q = pool[qi];
          r += '<div class="explain" style="margin-bottom:10px"><b>' + q.q + '</b><br>Твой ответ: ' + (sel[qi] === undefined ? '—' : q.o[sel[qi]]) + '<br>Верный ответ: ' + q.o[q.a] + '<br>' + q.e + '</div>';
        });
      }
      r += '<p><a class="btn ghost" href="#/test" id="again">Пройти заново</a> <a class="btn" href="#/cheat">Шпаргалка</a></p></div>';
      $('res').innerHTML = r;
      $('again').onclick = function (e) { e.preventDefault(); testView(); window.scrollTo(0, 0); };
      sub.disabled = true;
      $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }

  function route() {
    var p = (location.hash || '#/').replace(/^#\/?/, '').split('/');
    $('side').classList.remove('open');
    window.scrollTo(0, 0);
    if (p[0] === 'm' && C.modules[+p[1] - 1]) {
      var m = C.modules[+p[1] - 1];
      renderNav(m.id);
      if (p[2] === 'quiz') return quizView(m);
      if (p[2] && m.lessons[+p[2] - 1]) return lessonView(m, +p[2]);
      return modIntro(m);
    }
    if (p[0] === 'test') { renderNav('test'); return testView(); }
    if (p[0] === 'cheat') { renderNav('cheat'); view.innerHTML = C.cheat; mountWidgets(view); return; }
    renderNav('home'); homeView();
  }

  C.start = function () {
    view = $('view'); nav = $('nav');
    $('burger').onclick = function () { $('side').classList.toggle('open'); };
    $('resetBtn').onclick = function () {
      if (confirm('Сбросить весь прогресс курса?')) { localStorage.removeItem(KEY); load(); route(); }
    };
    window.addEventListener('hashchange', route);
    route();
  };
})();

<script>
(function () {
  var C = window.COURSE, esc = C.esc, W = C.widgets;

  function norm(s) { return s.trim().replace(/\s+/g, ' '); }

  W.terminal = function (el, cfg) {
    var i = 0, done = false, ctx = {};
    el.innerHTML = '<div class="term"><div class="term-top"><span>' + esc(cfg.title) + '</span><span class="prog" data-p></span></div>' +
      '<div class="term-task" data-task></div><div class="term-out" data-out></div>' +
      '<form class="term-in" data-form><span>$</span><input data-in autocomplete="off" spellcheck="false" aria-label="Команда"><button type="button" data-hint>Подсказка</button></form></div>';
    var out = el.querySelector('[data-out]'), inp = el.querySelector('[data-in]'), task = el.querySelector('[data-task]'), prog = el.querySelector('[data-p]');
    function line(cls, txt) { var d = document.createElement('div'); d.className = cls; d.textContent = txt; out.appendChild(d); out.scrollTop = out.scrollHeight; }
    function show() {
      prog.textContent = 'Шаг ' + Math.min(i + 1, cfg.steps.length) + ' из ' + cfg.steps.length;
      task.innerHTML = done ? '<b>Готово.</b> ' + cfg.finish : '<b>Задача:</b> ' + cfg.steps[i].task;
    }
    line('dim', cfg.prompt);
    show();
    el.querySelector('[data-hint]').onclick = function () {
      if (!done) line('dim', 'Подсказка: ' + cfg.steps[i].hint);
    };
    el.querySelector('[data-form]').onsubmit = function (e) {
      e.preventDefault();
      var v = norm(inp.value); inp.value = '';
      if (!v) return;
      line('cmd', cfg.ps + ' ' + v);
      if (done) { line('dim', 'Сценарий завершён. Обнови страницу уроком выше, чтобы пройти заново.'); return; }
      var s = cfg.steps[i], m = s.re.exec(v);
      if (m && s.check) {
        var bad = s.check(v, m, ctx);
        if (bad) { line('err', bad); return; }
      }
      if (m) {
        var o = typeof s.out === 'function' ? s.out(m, ctx) : s.out;
        o.split('\n').forEach(function (t) { line('', t); });
        i++;
        if (i >= cfg.steps.length) done = true;
        show();
      } else if (/^(git|gh)\b/.test(v)) {
        line('err', 'Команда допустима, но не подходит к текущей задаче сценария. ' + (s.wrong || 'Перечитай задачу или нажми «Подсказка».'));
      } else {
        line('err', 'bash: ' + v.split(' ')[0] + ': в этом тренажёре работают только команды git и gh.');
      }
    };
  };

  W.web = function (el, cfg) {
    var i = 0, done = false, ctx = {};
    el.innerHTML = '<div class="web"><div class="web-top"><span class="web-url" data-url></span><span class="prog" data-p></span></div>' +
      '<div class="web-task" data-task></div><div class="web-page" data-page></div>' +
      '<div class="web-act" data-act></div><div class="web-msg hid" data-msg></div>' +
      '<div class="web-foot"><button type="button" class="btn ghost" data-hint>Подсказка</button></div></div>';
    var url = el.querySelector('[data-url]'), prog = el.querySelector('[data-p]'), task = el.querySelector('[data-task]'),
      page = el.querySelector('[data-page]'), act = el.querySelector('[data-act]'), msg = el.querySelector('[data-msg]');
    function say(cls, html) { msg.className = 'web-msg ' + cls; msg.innerHTML = html; }
    function val(x) { return typeof x === 'function' ? x(ctx) : x; }
    function next(okText) {
      i++;
      if (i >= cfg.steps.length) done = true;
      show();
      if (okText) say('ok', okText);
    }
    function show() {
      msg.className = 'web-msg hid';
      prog.textContent = 'Шаг ' + Math.min(i + 1, cfg.steps.length) + ' из ' + cfg.steps.length;
      if (done) {
        task.innerHTML = '<b>Готово.</b> ' + cfg.finish;
        act.innerHTML = '';
        el.querySelector('[data-hint]').classList.add('hid');
        return;
      }
      var s = cfg.steps[i];
      url.textContent = val(s.url);
      task.innerHTML = '<b>Задача:</b> ' + val(s.task);
      page.innerHTML = val(s.view);
      act.innerHTML = '';
      if (s.input) {
        var f = document.createElement('form');
        f.className = 'web-form';
        f.innerHTML = '<label>' + s.input.label + '<input autocomplete="off" spellcheck="false" placeholder="' + esc(s.input.ph || '') + '"></label><button type="submit" class="btn">' + (s.input.btn || 'Продолжить') + '</button>';
        f.onsubmit = function (e) {
          e.preventDefault();
          var v = norm(f.querySelector('input').value);
          if (!s.input.re.test(v)) { say('bad', s.input.wrong); return; }
          ctx[s.input.key] = v;
          next(s.input.ok);
        };
        act.appendChild(f);
      } else {
        var order = s.choices.map(function (c, k) { return { c: c, k: k }; });
        order.sort(function () { return Math.random() - 0.5; });
        order.forEach(function (o) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'web-btn'; b.innerHTML = o.c.t;
          b.onclick = function () {
            if (o.c.ok) next(o.c.msg); else say('bad', o.c.msg);
          };
          act.appendChild(b);
        });
      }
    }
    el.querySelector('[data-hint]').onclick = function () {
      if (!done) say('dim', 'Подсказка: ' + val(cfg.steps[i].hint));
    };
    show();
  };

  W.skillfile = function (el, cfg) {
    el.innerHTML = '<div class="card"><p><b>' + esc(cfg.title) + '</b></p><pre><code>' + esc(cfg.text) + '</code></pre>' +
      '<div class="row"><button type="button" class="btn" data-copy>Скопировать</button><button type="button" class="btn ghost" data-dl>Скачать ' + esc(cfg.file) + '</button><span data-res></span></div></div>';
    var res = el.querySelector('[data-res]');
    el.querySelector('[data-copy]').onclick = function () {
      var ok = function () { res.textContent = 'Скопировано'; };
      var fb = function () {
        var t = document.createElement('textarea'); t.value = cfg.text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch (e) { res.textContent = 'Не удалось скопировать, выделите текст вручную'; }
        document.body.removeChild(t);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cfg.text).then(ok, fb); else fb();
    };
    el.querySelector('[data-dl]').onclick = function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([cfg.text], { type: 'text/markdown;charset=utf-8' }));
      a.download = cfg.file; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      res.textContent = 'Файл скачан';
    };
  };

  W.classify = function (el, cfg) {
    var h = '<div class="card"><p><b>' + cfg.title + '</b></p>';
    cfg.items.forEach(function (it, k) {
      h += '<div class="cls"><div>' + it.t + '</div><select data-k="' + k + '"><option value="">— выбери —</option>' +
        cfg.cats.map(function (c, ci) { return '<option value="' + ci + '">' + esc(c) + '</option>'; }).join('') + '</select><div class="m" data-m="' + k + '"></div></div>';
    });
    h += '<div class="row"><button type="button" class="btn" data-check>Проверить</button><span data-res></span></div><div class="explain hid" data-ex></div></div>';
    el.innerHTML = h;
    el.querySelector('[data-check]').onclick = function () {
      var ok = 0, empty = 0;
      cfg.items.forEach(function (it, k) {
        var v = el.querySelector('select[data-k="' + k + '"]').value, m = el.querySelector('[data-m="' + k + '"]');
        if (v === '') { empty++; m.textContent = ''; m.className = 'm'; return; }
        var good = +v === it.a;
        if (good) ok++;
        m.textContent = good ? '✓' : '✗'; m.className = 'm ' + (good ? 'ok' : 'bad');
      });
      el.querySelector('[data-res]').textContent = empty ? 'Заполни все строки' : 'Верно ' + ok + ' из ' + cfg.items.length;
      if (!empty) { var ex = el.querySelector('[data-ex]'); ex.innerHTML = cfg.explain; ex.classList.remove('hid'); }
    };
  };

  W.order = function (el, cfg) {
    var arr = cfg.items.map(function (t, i) { return { t: t, i: i }; });
    do { arr.sort(function () { return Math.random() - 0.5; }); } while (arr.every(function (x, p) { return x.i === p; }));
    function draw(mark) {
      var h = '<div class="card"><p><b>' + cfg.title + '</b></p><ul class="ord">';
      arr.forEach(function (x, p) {
        var cls = mark ? (x.i === p ? 'ok' : 'bad') : '';
        h += '<li class="' + cls + '"><span>' + x.t + '</span><button type="button" data-up="' + p + '" aria-label="Выше">↑</button><button type="button" data-dn="' + p + '" aria-label="Ниже">↓</button></li>';
      });
      h += '</ul><div class="row"><button type="button" class="btn" data-check>Проверить порядок</button><span data-res></span></div>' +
        '<div class="explain hid" data-ex>' + cfg.explain + '</div></div>';
      el.innerHTML = h;
      el.querySelectorAll('[data-up]').forEach(function (b) { b.onclick = function () { mv(+b.dataset.up, -1); }; });
      el.querySelectorAll('[data-dn]').forEach(function (b) { b.onclick = function () { mv(+b.dataset.dn, 1); }; });
      el.querySelector('[data-check]').onclick = function () {
        var ok = arr.every(function (x, p) { return x.i === p; });
        draw(true);
        el.querySelector('[data-res]').textContent = ok ? 'Порядок верный' : 'Есть ошибки: зелёные строки на месте, красные нет';
        if (ok) el.querySelector('[data-ex]').classList.remove('hid');
      };
    }
    function mv(p, d) {
      var q = p + d; if (q < 0 || q >= arr.length) return;
      var t = arr[p]; arr[p] = arr[q]; arr[q] = t; draw(false);
    }
    draw(false);
  };

})();

</script>

    {

        '<table><tr><th></th><th>Git</th><th>GitHub</th></tr><tr><td>Что это</td><td>Программа</td><td>Веб-сервис</td></tr><tr><td>Где работает</td><td>На вашем компьютере</td><td>В интернете, github.com</td></tr><tr><td>Что умеет</td><td>История, ветки, снимки</td><td>Общий доступ, pull request, обсуждения, проверки</td></tr></table>' +
